# Stage 2 e2e stand (docs/INFRA.md "Stage 2 e2e stand"), on top of the smoke stack:
# compose.yaml:compose.prod.yaml:compose.smoke.yaml:compose.web2.yaml, selected by
# lib.sh use_web2 (STACK=web2), which also sets PUBLIC_SCHEME=https and FORCE_HTTPS=1.
# web = ashyq-web-2 with its two runtime variables only (spec 7.13); WEB2_IMAGE overrides.
# stage-2: removed in Ф9 (ashyq-web is then built from apps/web-2).

# The server presigns and calls storage at https://ashyq.test (nginx, self-signed cert):
# rustls-native-certs trusts SSL_CERT_FILE instead of the system store.
# No Judge0 on the stand (profile off): a blank base URL turns the runner off, so `GET /code/runner`
# reads "not configured" instead of a 503 from an unreachable runner. `@judge0` specs (CI:
# --grep-invert) need the judge0 profile and WEB2_JUDGE0_URL=http://judge0-server:2358.
x-stand-cert: &stand-cert
  environment:
    SSL_CERT_FILE: /etc/ssl/stand/cert.pem
    AB__JUDGE0__BASE_URL: ${WEB2_JUDGE0_URL:-}
  volumes:
    - ${TLS_DIR:?}/cert.pem:/etc/ssl/stand/cert.pem:ro

services:
  web:
    image: ${WEB2_IMAGE:-${IMAGE_REPO:-ghcr.io/meirbek-dev}/ashyq-web-2:${IMAGE_TAG:?}}
    build: !override
      context: .
      dockerfile: apps/web-2/Dockerfile
    environment: !override
      PUBLIC_ORIGIN: https://${NGINX_SERVER_NAME:?}
      INTERNAL_API_URL: http://server:8000
    deploy:
      resources:
        limits:
          memory: 512m

  server: *stand-cert
  worker: *stand-cert

  # Test stand only: bcrypt cost 14 (Zitadel's default, prod) is ~1 s of Zitadel's single CPU per
  # hash, which serialized the 250-learner seed (~4.5 min) and every sign-in of the suite. 10 is
  # Zitadel's floor for a stored hash (LIMITS_BCRYPT_MINCOST): with 4 a password change failed
  # "Password is invalid" (B-SET-07, run 37185565326).
  zitadel:
    environment:
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_HASHER_COST: 10
