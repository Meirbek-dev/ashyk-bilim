# Stage 2 e2e stand (docs/INFRA.md "Stage 2 e2e stand"), on top of the smoke stack:
# compose.yaml:compose.prod.yaml:compose.smoke.yaml:compose.web2.yaml, selected by
# lib.sh use_web2 (STACK=web2), which also sets PUBLIC_SCHEME=https and FORCE_HTTPS=1.
# web = ashyq-web-2 with its two runtime variables only (spec 7.13); WEB2_IMAGE overrides.
# stage-2: removed in Ф9 (ashyq-web is then built from apps/web-2).

# The server presigns and calls storage at https://ashyq.test (nginx, self-signed cert):
# rustls-native-certs trusts SSL_CERT_FILE instead of the system store.
# No Judge0 on the stand (profile off): unset, `GET /code/runner` reads "not configured" instead of a
# 503 from an unreachable runner. `@judge0` specs (CI: --grep-invert) need the profile and these keys.
x-stand-cert: &stand-cert
  environment:
    SSL_CERT_FILE: /etc/ssl/stand/cert.pem
    AB__JUDGE0__BASE_URL: !reset null
    AB__JUDGE0__API_KEY: !reset null
    AB__JUDGE0__DATABASE_URL: !reset null
  volumes:
    - ${TLS_DIR:?}/cert.pem:/etc/ssl/stand/cert.pem:ro

services:
  web:
    image: ${WEB2_IMAGE:-${IMAGE_REPO:-ghcr.io/meirbek-dev}/ashyq-web-2:${IMAGE_TAG:?}}
    build: !override
      context: .
      dockerfile: apps/web-2/Dockerfile
    environment: !override
      PUBLIC_ORIGIN: https://${NGINX_SERVER_NAME:?}
      INTERNAL_API_URL: http://server:8000
    deploy:
      resources:
        limits:
          memory: 512m

  server: *stand-cert
  worker: *stand-cert
