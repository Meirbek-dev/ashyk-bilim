# Smoke overrides (CI stack-smoke, `just stack-up`), on top of compose.yaml +
# compose.prod.yaml. Values: infra/env/smoke.env + a copy of smoke.server.env.
# Plain http on ashyq.test (PUBLIC_SCHEME=http, FORCE_HTTPS=0); Judge0 profile off.
# WEB_IMAGE=<stub> swaps the web app for infra/smoke/stub-web (edge is web-agnostic).

services:
  nginx:
    # Loopback only: smoke runs `curl --resolve ashyq.test:80:127.0.0.1`.
    ports: !override
      - '127.0.0.1:${HTTP_PORT:-80}:80'
      - '127.0.0.1:${HTTPS_PORT:-443}:443'
