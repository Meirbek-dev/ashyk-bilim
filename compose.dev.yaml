# Dev overrides (just dev-up): server dependencies on 127.0.0.1 for apps/server.
# Values: infra/env/dev.env (committed, non-secret). Ports follow this repo's
# conventions; override DEV_*_PORT in the shell to run a second copy.

networks:
  # Published ports need a non-internal network.
  data-net:
    internal: false
  exec-net:
    internal: false

services:
  db:
    ports: ['127.0.0.1:${DEV_PG_PORT:-5433}:5432']
    # Connections for parallel test runs (12 x 5 pools) and e2e slots; DEV_PG_ARGS for extra flags (CI's
    # server-test turns durability off for throwaway databases).
    command: >-
      postgres -c config_file=/etc/postgresql/postgresql.conf
      -c log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT:-300}
      -c max_connections=200
      ${DEV_PG_ARGS:-}
    # Parallel e2e workers and test runs: production's CPU caps queue them past client timeouts.
    deploy: &dev-cpus
      resources:
        limits:
          cpus: '4.0'

  redis:
    ports: ['127.0.0.1:${DEV_REDIS_PORT:-6380}:6379']

  zitadel:
    ports: ['127.0.0.1:${DEV_ZITADEL_PORT:-8081}:8080']
    # One CPU hashes passwords for a few logins a second; parallel e2e sign-ins timed out (10 s) behind it.
    deploy: *dev-cpus
    environment:
      # Zitadel routes by Host: the server calls http://localhost:<port>.
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${DEV_ZITADEL_PORT:-8081}

  rustfs:
    ports: ['127.0.0.1:${DEV_RUSTFS_PORT:-9002}:9000']

  # Profile runner (`just dev-runner`, `just stack up --runner`): the API calls it on the host.
  runner:
    ports: ['127.0.0.1:${DEV_RUNNER_PORT:-5050}:5050']
