# Dev overrides (just dev-up): server dependencies on 127.0.0.1 for apps/server.
# Values: infra/env/dev.env (committed, non-secret). Ports follow this repo's
# conventions; override DEV_*_PORT in the shell to run a second copy.

networks:
  # Published ports need a non-internal network.
  data-net:
    internal: false

services:
  db:
    ports: ['127.0.0.1:${DEV_PG_PORT:-5433}:5432']
    # Extra server flags; CI's server-test turns durability off (throwaway test databases).
    command: postgres ${DEV_PG_ARGS:-}

  redis:
    ports: ['127.0.0.1:${DEV_REDIS_PORT:-6380}:6379']

  zitadel:
    ports: ['127.0.0.1:${DEV_ZITADEL_PORT:-8081}:8080']
    environment:
      # Zitadel routes by Host: the server calls http://localhost:<port>.
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${DEV_ZITADEL_PORT:-8081}

  rustfs:
    ports: ['127.0.0.1:${DEV_RUSTFS_PORT:-9002}:9000']
