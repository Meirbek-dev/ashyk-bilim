# App tier, edge and backup on top of compose.yaml (see its header).
# Interpolation: ./.env (template infra/env/prod.env.example); no service loads it.
# Server secrets: ${SERVER_ENV_FILE:-./server.env} (only AB__*; infra/env/server.env.example).
# Path overrides (SERVER_ENV_FILE, STACK_ENV_FILE, TLS_*) must start with ./ or /.
# Images come from CI (GHCR, tag = commit sha); deploy pulls and runs with --no-build.
# The build sections only serve a local `compose build`.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-server-image: &server-image ${IMAGE_REPO:-ghcr.io/meirbek-dev}/ashyq-server:${IMAGE_TAG:?Set IMAGE_TAG to the release commit}

# Topology derived from .env. Overrides server.env for the same keys.
x-server-env: &server-env
  AB__ENVIRONMENT: production
  AB__SERVER__HOST: 0.0.0.0
  AB__SERVER__PORT: 8000
  AB__SERVER__CORS_ORIGINS: '["${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}"]'
  AB__SERVER__WEB_URL: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
  # stage-2 (S-11): link map of the web in service, `legacy` or `v2` (docs/STAGE-2-CUTOVER.md).
  AB__SERVER__WEB_LINKS: ${WEB_LINKS:-legacy}
  AB__REDIS__URL: redis://:${REDIS_PASSWORD:?}@redis:6379/2
  AB__ZITADEL__BASE_URL: http://zitadel:8080
  # The server signs S3 URLs for the public origin and calls storage through it;
  # inside the stack that name resolves to nginx (network alias on edge-net).
  AB__STORAGE__ENDPOINT: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
  AB__STORAGE__ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
  AB__STORAGE__SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
  AB__STORAGE__PUBLIC_BUCKET: ab-public
  AB__STORAGE__PRIVATE_BUCKET: ab-private
  AB__TELEMETRY__JSON_LOGS: 'true'
  AB__JUDGE0__BASE_URL: http://judge0-server:2358
  AB__JUDGE0__API_KEY: ${JUDGE0_AUTHN_TOKEN:?}
  AB__JUDGE0__DATABASE_URL: postgres://judge0:${JUDGE0_DB_PASSWORD:?}@judge0-db:5432/judge0

x-app-depends: &app-depends
  db:
    condition: service_healthy
  db-init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  zitadel:
    condition: service_healthy
  rustfs:
    condition: service_started
  storage-init:
    condition: service_completed_successfully

services:
  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  nginx:
    image: docker.io/library/nginx:1.31.6-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      # Default = trust nobody (loopback never forwards for clients).
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: '1'
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/routes.conf:/etc/nginx/snippets/routes.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Directory mount: the certbot hook replaces cert.pem/key.pem (new inodes).
      - ${TLS_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx/app
    networks:
      edge-net:
        # server/worker/web reach the public origin here (no NAT loopback, no host-gateway).
        aliases:
          - ${NGINX_SERVER_NAME:?}
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'
    logging: *logging

  # ---------------------------------------------------------------------------
  # Web (HEALTHCHECK comes from the image). stage-2: WEB_IMAGE_NAME=ashyq-web-2
  # runs the new web at the same IMAGE_TAG; it reads only PUBLIC_ORIGIN and
  # INTERNAL_API_URL (origin part), the old web ignores PUBLIC_ORIGIN.
  # ---------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-${IMAGE_REPO:-ghcr.io/meirbek-dev}/${WEB_IMAGE_NAME:-ashyq-web}:${IMAGE_TAG:?}}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # stage-2: replace with runtime config
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}/
        NEXT_PUBLIC_API_URL: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}/api/v2/
        NEXT_PUBLIC_MEDIA_URL: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}/
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
      INTERNAL_API_URL: http://server:8000/api/v2/
      APP_URL: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?}
    networks: [edge-net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # stage-2: 512m for the new web (spec 10.3), 2g for the old one.
          memory: ${WEB_MEMORY:-2g}
          cpus: '2.0'
    logging: *logging

  # ---------------------------------------------------------------------------
  # Server + worker (HEALTHCHECK of server comes from the image: liveness only,
  # readiness is checked through nginx by smoke.sh)
  # ---------------------------------------------------------------------------
  server:
    image: *server-image
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['serve']
    restart: unless-stopped
    env_file: ${SERVER_ENV_FILE:-./server.env}
    environment: *server-env
    # edge-net: nginx alias + internet egress (AI providers, email, OTLP).
    networks: [edge-net, data-net, exec-net]
    depends_on: *app-depends
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
    logging: *logging

  worker:
    image: *server-image
    command: ['worker']
    restart: unless-stopped
    env_file: ${SERVER_ENV_FILE:-./server.env}
    environment: *server-env
    networks: [edge-net, data-net, exec-net]
    depends_on: *app-depends
    # No HTTP port (the image's HEALTHCHECK curls :8000), and `up --wait` rejects
    # a container without a healthcheck: liveness = the process is running.
    healthcheck:
      test: ['CMD', 'true']
      interval: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
    logging: *logging

  # SQLx migrations: `compose run --rm server-migrate` (deploy, bootstrap).
  server-migrate:
    image: *server-image
    command: ['migrate']
    profiles: [maintenance]
    env_file: ${SERVER_ENV_FILE:-./server.env}
    environment: *server-env
    networks: [data-net]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    logging: *logging

  # ---------------------------------------------------------------------------
  # Overrides of compose.yaml services
  # ---------------------------------------------------------------------------
  db:
    volumes:
      - db_dumps:/dumps
    labels:
      # Run by the backup service before archiving; no service is stopped.
      docker-volume-backup.archive-pre: >-
        /bin/sh -c 'set -e; cd /dumps;
        for d in ashyq zitadel; do pg_dump -U "$$POSTGRES_USER" -Fc -f $$d.dump.tmp $$d; mv $$d.dump.tmp $$d.dump; done;
        pg_dumpall -U "$$POSTGRES_USER" --globals-only -f globals.sql.tmp; mv globals.sql.tmp globals.sql'

  redis:
    labels:
      # Fresh dump.rdb for the live copy of redis_data (sessions).
      docker-volume-backup.archive-pre: redis-cli SAVE

  storage-init:
    environment:
      STORAGE_CORS_ORIGINS: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}

  # ---------------------------------------------------------------------------
  # Backup: daily 02:00, ./backups, 7 days (offsite declined by the owner).
  # Archive layout: backup/{db_dumps,rustfs,redis,zitadel_machinekey,secrets}.
  # Restore: infra/scripts/restore.sh. Not archived: postgres_data (the dumps
  # are), judge0 (ephemeral), nginx cache.
  # ---------------------------------------------------------------------------
  backup:
    image: docker.io/offen/docker-volume-backup:v2.49.1
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: '0 2 * * *'
      BACKUP_RETENTION_DAYS: '7'
      BACKUP_COMPRESSION: zst
      BACKUP_FILENAME: 'backup-%Y-%m-%dT%H-%M-%S.{{ .Extension }}'
      BACKUP_PRUNING_PREFIX: backup-
    volumes:
      - db_dumps:/backup/db_dumps:ro
      # ponytail: live copy of the whole bucket volume (object keys are immutable);
      # fine up to ~20 GB, beyond that switch to an incremental `rclone sync`.
      - rustfs_data:/backup/rustfs:ro
      - redis_data:/backup/redis:ro
      - zitadel_machinekey:/backup/zitadel_machinekey:ro
      - ${STACK_ENV_FILE:-./.env}:/backup/secrets/.env:ro
      - ${SERVER_ENV_FILE:-./server.env}:/backup/secrets/server.env:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${BACKUP_DIR:-./backups}:/archive
    network_mode: none
    logging: *logging

volumes:
  nginx_cache:
  db_dumps:
