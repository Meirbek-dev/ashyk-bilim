# App tier, edge and backup on top of compose.yaml (see its header).
# Interpolation: ./.env (template infra/env/prod.env.example); no service loads it.
# Server secrets: ${SERVER_ENV_FILE:-./server.env} (only AB__*; infra/env/server.env.example).
# Path overrides (SERVER_ENV_FILE, STACK_ENV_FILE, TLS_*) must start with ./ or /.
# Images come from CI (GHCR, tag = commit sha); deploy pulls and runs with --no-build.
# The build sections only serve a local `compose build`.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-server-image: &server-image ${IMAGE_REPO:-ghcr.io/meirbek-dev}/ashyq-server:${IMAGE_TAG:?Set IMAGE_TAG to the release commit}

# Topology derived from .env. Overrides server.env for the same keys.
x-server-env: &server-env
  AB__ENVIRONMENT: production
  AB__SERVER__HOST: 0.0.0.0
  AB__SERVER__PORT: 8000
  AB__SERVER__CORS_ORIGINS: '["${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}"]'
  AB__SERVER__WEB_URL: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
  # stage-2 (S-11): link map of the web in service, `legacy` or `v2` (docs/STAGE-2-CUTOVER.md).
  AB__SERVER__WEB_LINKS: ${WEB_LINKS:-legacy}
  AB__REDIS__URL: redis://:${REDIS_PASSWORD:?}@redis:6379/2
  AB__ZITADEL__BASE_URL: http://zitadel:8080
  # The server signs S3 URLs for the public origin and calls storage through it;
  # inside the stack that name resolves to nginx (network alias on edge-net).
  AB__STORAGE__ENDPOINT: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
  AB__STORAGE__ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
  AB__STORAGE__SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
  AB__STORAGE__PUBLIC_BUCKET: ab-public
  AB__STORAGE__PRIVATE_BUCKET: ab-private
  AB__TELEMETRY__JSON_LOGS: 'true'
  AB__RUNNER__BASE_URL: http://runner:5050
  AB__RUNNER__AUTH_TOKEN: ${RUNNER_AUTH_TOKEN:?}

x-app-depends: &app-depends
  db:
    condition: service_healthy
  db-init:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  zitadel:
    condition: service_healthy
  rustfs:
    condition: service_started
  storage-init:
    condition: service_completed_successfully

services:
  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  nginx:
    image: docker.io/library/nginx:1.31.8-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      # Default = trust nobody (loopback never forwards for clients).
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1/32}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: '1'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/routes.conf:/etc/nginx/snippets/routes.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Directory mount: the certbot hook replaces cert.pem/key.pem (new inodes).
      - ${TLS_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx/app
      - nginx_content_cache:/var/cache/nginx/content
    networks:
      edge-net:
        # server/worker/web reach the public origin here (no NAT loopback, no host-gateway).
        aliases:
          - ${NGINX_SERVER_NAME:?}
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    logging: *logging

  # ---------------------------------------------------------------------------
  # Web: apps/web-2 (HEALTHCHECK comes from the image). One image for any domain: it reads only
  # PUBLIC_ORIGIN and INTERNAL_API_URL at startup. WEB_IMAGE swaps it (the smoke stub).
  # ---------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-${IMAGE_REPO:-ghcr.io/meirbek-dev}/ashyq-web-2:${IMAGE_TAG:?}}
    build:
      context: .
      dockerfile: apps/web-2/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}
      INTERNAL_API_URL: http://server:8000
    networks: [edge-net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2.0'
    logging: *logging

  # ---------------------------------------------------------------------------
  # Server + worker (HEALTHCHECK of server comes from the image: liveness only,
  # readiness is checked through nginx by smoke.sh)
  # ---------------------------------------------------------------------------
  server:
    image: *server-image
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['serve']
    restart: unless-stopped
    env_file: ${SERVER_ENV_FILE:-./server.env}
    environment: *server-env
    # edge-net: nginx alias + internet egress (AI providers, email, OTLP).
    networks: [edge-net, data-net, exec-net]
    depends_on: *app-depends
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
    logging: *logging

  worker:
    image: *server-image
    command: ['worker']
    restart: unless-stopped
    env_file: ${SERVER_ENV_FILE:-./server.env}
    environment: *server-env
    networks: [edge-net, data-net, exec-net]
    depends_on: *app-depends
    # No HTTP port (the image's HEALTHCHECK curls :8000), and `up --wait` rejects
    # a container without a healthcheck: liveness = the process is running.
    healthcheck:
      test: ['CMD', 'true']
      interval: 30s
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
    logging: *logging

  # SQLx migrations: `compose run --rm server-migrate` (deploy, bootstrap). Always the owner `ashyq`: server
  # and worker connect as ashyq_app (server.env), which may not run DDL (RUNBOOK 2.5).
  server-migrate:
    image: *server-image
    command: ['migrate']
    profiles: [maintenance]
    env_file: ${SERVER_ENV_FILE:-./server.env}
    environment:
      <<: *server-env
      AB__DATABASE__URL: postgres://ashyq:${ASHYQ_DB_PASSWORD:?}@db:5432/ashyq
    networks: [data-net]
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    logging: *logging

  # ---------------------------------------------------------------------------
  # Overrides of compose.yaml services
  # ---------------------------------------------------------------------------
  # Point-in-time recovery (RUNBOOK 3.13): every WAL segment is archived into ${BACKUP_DIR}/pitr/wal
  # (infra/postgres/wal-archive.sh), at the latest after PG_ARCHIVE_TIMEOUT seconds (default 300 = the recovery
  # point); backup.sh adds a nightly base backup to ${BACKUP_DIR}/pitr/base. Keep the flags of compose.yaml.
  db:
    command: >-
      postgres -c config_file=/etc/postgresql/postgresql.conf
      -c log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT:-300}
      -c archive_mode=${PG_ARCHIVE_MODE:-on}
      -c "archive_command=sh /pg/wal-archive.sh %p %f"
      -c archive_timeout=${PG_ARCHIVE_TIMEOUT:-300}
    volumes:
      # infra/scripts/backup.sh writes the nightly dumps here.
      - db_dumps:/dumps
      - ./infra/postgres:/pg:ro
      - ${BACKUP_DIR:-./backups}/pitr:/pitr
    # A clean shutdown archives the last WAL segment; Docker's default 10 s can cut it short.
    stop_grace_period: 2m
    depends_on:
      pitr-init:
        condition: service_completed_successfully

  # Zitadel's own instance, archived the same way into ${BACKUP_DIR}/pitr-zitadel (RUNBOOK 3.13, 3.14).
  zitadel-db:
    command: >-
      postgres
      -c log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT:-300}
      -c log_parameter_max_length=0
      -c "log_line_prefix=%m [%p] user=%u db=%d app=%a "
      -c archive_mode=${PG_ARCHIVE_MODE:-on}
      -c "archive_command=sh /pg/wal-archive.sh %p %f"
      -c archive_timeout=${PG_ARCHIVE_TIMEOUT:-300}
    volumes:
      - db_dumps:/dumps
      - ./infra/postgres:/pg:ro
      - ${BACKUP_DIR:-./backups}/pitr-zitadel:/pitr
    stop_grace_period: 2m
    depends_on:
      pitr-init:
        condition: service_completed_successfully

  # The WAL archives belong to the instances' postgres user (the backup directory is root's).
  pitr-init:
    image: docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    entrypoint:
      - sh
      - -c
      - for a in /pitr /pitr-zitadel; do mkdir -p $$a/wal $$a/base && chown postgres:postgres $$a $$a/wal $$a/base && chmod 700 $$a || exit 1; done
    volumes:
      - ${BACKUP_DIR:-./backups}/pitr:/pitr
      - ${BACKUP_DIR:-./backups}/pitr-zitadel:/pitr-zitadel
    network_mode: none
    logging: *logging

  storage-init:
    environment:
      STORAGE_CORS_ORIGINS: ${PUBLIC_SCHEME:-https}://${NGINX_SERVER_NAME:?}

  # ---------------------------------------------------------------------------
  # Backup: restic repository in ${BACKUP_DIR}/restic (same disk; offsite declined
  # by the owner). infra/scripts/backup.sh (`just backup`, host timer infra/host/)
  # dumps, then snapshots backup/{db_dumps,rustfs,redis,zitadel_machinekey,secrets}.
  # Incremental and deduplicated: unchanged RustFS objects are never written again.
  # Restore: infra/scripts/restore.sh. Not backed up: postgres_data and zitadel_pg_data (the dumps
  # are), the code runner (stateless), nginx cache. Never started by `up` (profile).
  # ---------------------------------------------------------------------------
  backup:
    image: &restic-image docker.io/restic/restic:0.19.1
    profiles: [backup]
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${BACKUP_PASSWORD:-}
      RESTIC_CACHE_DIR: /cache
    volumes:
      - db_dumps:/backup/db_dumps:ro
      # ponytail: the whole bucket directory; object keys are immutable, so restic
      # only reads metadata of unchanged files and writes new objects.
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/backup/rustfs:ro
      # Preserve the live volume's ownership when Redis has not saved its first snapshot yet.
      - redis_data:/backup/redis:ro,nocopy
      - zitadel_machinekey:/backup/zitadel_machinekey:ro
      - ${STACK_ENV_FILE:-./.env}:/backup/secrets/.env:ro
      - ${SERVER_ENV_FILE:-./server.env}:/backup/secrets/server.env:ro
      - ${BACKUP_DIR:-./backups}/restic:/repo
      - restic_cache:/cache
    network_mode: none
    logging: *logging

volumes:
  nginx_cache:
  nginx_content_cache:
  db_dumps:
  restic_cache:
