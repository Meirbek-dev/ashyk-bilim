# Shared tier: data services, the code runner (profile `runner`) and one-shot init jobs.
# Never used alone; infra/scripts/lib.sh selects the file set:
#   prod  = compose.yaml:compose.prod.yaml
#   dev   = compose.yaml:compose.dev.yaml                  (just dev-up)
#   smoke = compose.yaml:compose.prod.yaml:compose.smoke.yaml
#   web2 = smoke + compose.web2.yaml; web-e2e = web2 + compose.web-e2e.yaml
#
# Networks: edge-net (nginx and everything it or the apps must reach, has egress),
# data-net (internal: db, redis, zitadel, rustfs, init jobs), exec-net (internal: the code runner).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-zitadel-db: &zitadel-db
  ZITADEL_DATABASE_POSTGRES_HOST: db
  ZITADEL_DATABASE_POSTGRES_PORT: 5432
  ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
  ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
  ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable

networks:
  edge-net: {}
  data-net:
    internal: true
  exec-net:
    internal: true

services:
  # --- Database: one image everywhere (trixie: glibc collation of the prod cluster)
  db:
    image: &pg-image docker.io/pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    # Keep these logging flags in compose.dev.yaml's command override too.
    command: >-
      postgres
      -c log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT:-300}
      -c log_parameter_max_length=0
      -c "log_line_prefix=%m [%p] user=%u db=%d app=%a "
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [data-net]
    healthcheck:
      # TCP, not the socket: the initdb-time server listens on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'
    logging: *logging

  # Roles and databases (infra/postgres/init.sql), idempotent, as the superuser.
  db-init:
    image: *pg-image
    entrypoint:
      - sh
      - -c
      - >-
        exec psql -v ON_ERROR_STOP=1
        -v ashyq_password="$$ASHYQ_DB_PASSWORD"
        -v zitadel_password="$$ZITADEL_DB_PASSWORD"
        -v databases="$$ASHYQ_DATABASES"
        -v createdb="$$ASHYQ_DB_CREATEDB"
        -f /init.sql
    environment:
      PGHOST: db
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      ASHYQ_DB_PASSWORD: ${ASHYQ_DB_PASSWORD:?}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
      ASHYQ_DATABASES: ${ASHYQ_DATABASES:-ashyq}
      ASHYQ_DB_CREATEDB: ${ASHYQ_DB_CREATEDB:-false}
    volumes:
      - ./infra/postgres/init.sql:/init.sql:ro
    networks: [data-net]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # --- Cache
  redis:
    image: docker.io/library/redis:8.10.3-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    networks: [data-net]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'
    logging: *logging

  # --- Identity: Zitadel, internal only (no public route)
  # Empty volumes belong to root; Zitadel (uid 1000) must write pat.txt.
  volume-init:
    image: *pg-image
    entrypoint: ['sh', '-c', 'chown 1000:1000 /machinekey && chmod 0700 /machinekey']
    volumes:
      - zitadel_machinekey:/machinekey
    network_mode: none
    logging: *logging

  # The only place holding the Postgres admin credentials for Zitadel.
  zitadel-init:
    image: &zitadel-image ghcr.io/zitadel/zitadel:v4.20.0@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    command: ['init']
    environment:
      <<: *zitadel-db
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-postgres}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
    networks: [data-net]
    depends_on:
      db-init:
        condition: service_completed_successfully
    logging: *logging

  zitadel:
    image: *zitadel-image
    restart: unless-stopped
    command: ['start-from-setup', '--masterkeyFromEnv', '--tlsMode', 'disabled']
    environment:
      <<: *zitadel-db
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?32 characters}
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: 'false'
      # Same as --tlsMode disabled; `zitadel ready` (healthcheck) reads only the config.
      ZITADEL_TLS_ENABLED: 'false'
      # Imported users still carry Argon2id hashes until their next login.
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2,bcrypt
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ashyq-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: ashyq-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRATION:?RFC3339}
    volumes:
      - zitadel_machinekey:/machinekey
    networks: [data-net]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      zitadel-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    logging: *logging

  # --- Object storage (S3)
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
      RUSTFS_VOLUMES: /data
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/data
    networks: [edge-net, data-net]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    logging: *logging

  # Buckets, public-read policy, CORS, smoke probe object. Idempotent.
  storage-init:
    image: docker.io/amazon/aws-cli:2.39.3
    entrypoint: ['bash', '/storage/init.sh']
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_PAGER: ''
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./infra/storage:/storage:ro
    networks: [data-net]
    depends_on:
      rustfs:
        condition: service_started
    logging: *logging

  # --- Code execution (profile `runner`): go-judge with the toolchains of infra/runner/Dockerfile.
  # Privileged for its sandbox (namespaces, cgroup v2 under the container's own cgroup); no state.
  runner:
    image: ${RUNNER_IMAGE:-${IMAGE_REPO:-ghcr.io/meirbek-dev}/ashyq-runner:${IMAGE_TAG:-dev}}
    build:
      context: ./infra/runner
    profiles: [runner]
    privileged: true
    # go-judge keeps compiled programs in /dev/shm (its file store).
    shm_size: 256m
    restart: unless-stopped
    # The ceiling of every program at once; go-judge sizes each run inside it.
    cpus: ${RUNNER_CPUS:-4}
    mem_limit: ${RUNNER_MEMORY:-6g}
    environment:
      ES_AUTH_TOKEN: ${RUNNER_AUTH_TOKEN:?}
      # Programs at once; keep AB__RUNNER__MAX_CONCURRENCY (per server process) at or under it.
      ES_PARALLELISM: ${RUNNER_PARALLELISM:-4}
    networks: [exec-net]
    healthcheck:
      # The image has no curl: /version answers without the token.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/5050 && printf 'GET /version HTTP/1.0\r\n\r\n' >&3 && grep -q buildVersion <&3
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging

# Names are load-bearing: prod volumes are <project>_<name>; renaming = empty volumes.
volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  zitadel_machinekey:
