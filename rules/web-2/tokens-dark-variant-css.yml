# G-11: Colors stay tokens (docs/web/DESIGN.md). CSS outside src/styles/.
# Any text the class or color can be written in: values, selectors, strings, comments.
id: tokens-dark-variant-css
language: css
severity: error
message: 'dark mode comes from light-dark() tokens: drop the dark: variant'
files: ['apps/web-2/src/**/*.css']
ignores: ['apps/web-2/src/styles/**']
rule:
  regex: '\bdark:[\w\[!-]'
  any:
    - kind: comment
    - kind: js_comment
    - kind: plain_value
    - kind: color_value
    - kind: string_content
    - kind: identifier
    - kind: property_name
    - kind: tag_name
    - kind: id_selector
    - kind: attribute_name
    - kind: keyword_query
    - kind: feature_name
    - kind: at_keyword
