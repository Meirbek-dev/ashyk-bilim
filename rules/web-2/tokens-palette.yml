# G-11: Colors stay tokens (docs/web/DESIGN.md).
# Any text the class or color can be written in: strings, template parts, JSX text, comments, regexes.
id: tokens-palette
language: tsx
severity: error
message: 'use a token class (bg-primary, text-muted-foreground, border-border...)'
files: ['apps/web-2/src/**/*.ts', 'apps/web-2/src/**/*.tsx']
ignores: ['apps/web-2/src/shared/api/gen*/**', 'apps/web-2/src/routeTree.*.ts']
rule:
  regex: '\b(?:bg|text|border|ring|fill|stroke|from|via|to|outline|decoration|shadow|accent|caret|divide|placeholder)-(?:slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose|black|white)(?:-\d{2,3})?\b'
  any:
    - kind: string_fragment
    - kind: comment
    - kind: jsx_text
    - kind: regex_pattern
