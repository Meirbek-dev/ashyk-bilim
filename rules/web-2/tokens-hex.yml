# G-11: Colors stay tokens (docs/web/DESIGN.md); stock shadcn output in src/shared/ui/ is the generator's and exempt.
# Any text the class or color can be written in: strings, template parts, JSX text, comments, regexes.
id: tokens-hex
language: tsx
severity: error
message: 'colors live in src/styles/ tokens and public/themes/'
files: ['apps/web-2/src/**/*.ts', 'apps/web-2/src/**/*.tsx']
ignores: ['apps/web-2/src/shared/ui/**', 'apps/web-2/src/shared/api/gen*/**', 'apps/web-2/src/routeTree.*.ts']
rule:
  regex: '#[0-9a-fA-F]{3,8}\b'
  any:
    - kind: string_fragment
    - kind: comment
    - kind: jsx_text
    - kind: regex_pattern
