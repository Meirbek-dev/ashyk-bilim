id: no-literal-query-key
valid:
  - |-
    useQuery({ queryKey: listCoursesQueryKey(), queryFn })
  - |-
    useQuery({ queryKey, queryFn })
  - |-
    const { queryKey: [first] } = options
invalid:
  - |-
    useQuery({ queryKey: ['courses'], queryFn })
  - |-
    client.invalidateQueries({ queryKey: [] })
