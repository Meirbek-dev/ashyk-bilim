# Settings of the app's Postgres (`db`) on every stack, mounted read-only and passed as `config_file`.
# The cluster's own file comes first, so what initdb wrote (locale, time zone) stays; everything below
# overrides it. Flags on the command line still win: the slow-query threshold
# (PG_LOG_MIN_DURATION_STATEMENT), WAL archiving (compose.prod.yaml) and dev/CI extras (compose.dev.yaml).
# ALTER SYSTEM (postgresql.auto.conf) would win over all of it: keep it empty.
#
# Applying a change: `docker compose restart db` for the settings marked [restart]; the others reload with
# `SELECT pg_reload_conf()`.
include_if_exists = '/var/lib/postgresql/18/docker/postgresql.conf'

listen_addresses = '*'                      # [restart]

# --- Memory: the container is capped at 1 GB (compose.yaml)
max_connections = 60                        # [restart] server + worker pools, admin commands, backups
shared_buffers = 256MB                      # [restart] a quarter of the container
effective_cache_size = 640MB                # what the page cache can hold besides shared_buffers
work_mem = 8MB                              # per sort/hash node and parallel worker (hash nodes 2x), several per
                                            # query: the pools (server + worker, 10 each) keep it inside the
                                            # cap, max_connections alone would not; log_temp_files shows spills
maintenance_work_mem = 64MB                 # index builds (HNSW), VACUUM

# --- Planner: the volume is on SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Compression: WAL is archived for PITR; lz4 costs less CPU than pglz for large text
wal_compression = lz4
default_toast_compression = lz4             # new values only

# --- Asynchronous I/O (Postgres 18). The image is built with liburing, but io_uring needs the io_uring_*
# syscalls, which the default seccomp profile of Docker (25+) and Podman blocks: with it the server refuses to
# start ("could not setup io_uring queue: Function not implemented"). Allowing them means a custom seccomp
# profile for db, a kernel attack surface the sandbox removes on purpose (QUESTIONS.md Q-2026-11-24-1). Worker
# processes give the same read-ahead without it; the data set fits in memory, so the difference is small.
io_method = worker                          # [restart]

# --- Statistics: `just prod-report` lists the top statements by total time and the slow plans
shared_preload_libraries = 'pg_stat_statements,auto_explain'   # [restart]
pg_stat_statements.track = top
track_io_timing = on

# auto_explain: the plan of every statement slower than 500 ms, in the container log (`just prod-report`).
# log_analyze adds actual rows per node (estimate vs reality, the usual cause of a bad plan), but it instruments
# every statement, not only the slow ones, so log_timing stays off: per-node clock reads are what make ANALYZE
# expensive, row and buffer counters are cheap. Parameter values are never logged, like statements.
auto_explain.log_min_duration = 500ms
auto_explain.log_analyze = on
auto_explain.log_timing = off
auto_explain.log_buffers = on
auto_explain.log_parameter_max_length = 0
auto_explain.log_format = text

# --- Logging (stderr, the rotating container log)
log_line_prefix = '%m [%p] user=%u db=%d app=%a '
log_parameter_max_length = 0                # bound parameter values are not logged
log_lock_waits = on                         # waits longer than deadlock_timeout (1 s)
log_autovacuum_min_duration = 1s
log_temp_files = 0                          # every sort or hash that spilled to disk
