# Settings of the app's Postgres (`db`) on every stack, mounted read-only and passed as `config_file`.
# The cluster's own file comes first, so what initdb wrote (locale, time zone) stays; everything below
# overrides it. Flags on the command line still win: the slow-query threshold
# (PG_LOG_MIN_DURATION_STATEMENT), WAL archiving (compose.prod.yaml) and dev/CI extras (compose.dev.yaml).
# ALTER SYSTEM (postgresql.auto.conf) would win over all of it: keep it empty.
#
# Applying a change: `docker compose restart db` for the settings marked [restart]; the others reload with
# `SELECT pg_reload_conf()`.
include_if_exists = '/var/lib/postgresql/18/docker/postgresql.conf'

listen_addresses = '*'                      # [restart]

# --- Memory: the container is capped at 1 GB (compose.yaml)
max_connections = 60                        # [restart] server + worker pools, admin commands, backups
shared_buffers = 256MB                      # [restart] a quarter of the container
effective_cache_size = 640MB                # what the page cache can hold besides shared_buffers
work_mem = 8MB                              # per sort/hash node; 60 connections stay inside the cap
maintenance_work_mem = 64MB                 # index builds (HNSW), VACUUM

# --- Planner: the volume is on SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Compression: WAL is archived for PITR; lz4 costs less CPU than pglz for large text
wal_compression = lz4
default_toast_compression = lz4             # new values only

# --- Statistics: `just prod-report` lists the top statements by total time
shared_preload_libraries = 'pg_stat_statements'   # [restart]
pg_stat_statements.track = top
track_io_timing = on

# --- Logging (stderr, the rotating container log)
log_line_prefix = '%m [%p] user=%u db=%d app=%a '
log_parameter_max_length = 0                # bound parameter values are not logged
log_lock_waits = on                         # waits longer than deadlock_timeout (1 s)
log_autovacuum_min_duration = 1s
log_temp_files = 0                          # every sort or hash that spilled to disk
