# Judge0 1.13.1: non-default, non-secret settings only. The image sources this file
# OVER the container environment, so never list a key here that compose sets
# (REDIS_*, POSTGRES_*, AUTHN_TOKEN): even an empty `KEY=` would win.
# Defaults and the full key list: https://github.com/judge0/judge0/blob/v1.13.1/judge0.conf

JUDGE0_TELEMETRY_ENABLE=false

# Parallel workers; keep in sync with the server's judge0.max_concurrency.
COUNT=2

# Limits in KB; per-process accounting (multi-threaded runtimes: JVM, Go, .NET).
MEMORY_LIMIT=1048576
MAX_MEMORY_LIMIT=2097152
STACK_LIMIT=65536
MAX_STACK_LIMIT=131072
MAX_PROCESSES_AND_OR_THREADS=128
MAX_MAX_PROCESSES_AND_OR_THREADS=256
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
