# Dual-web routing check (infra/tests/dual-web.sh, run by `just ci-infra`): the real edge in front of two stub webs
# that answer "<name> <uri>", on top of the smoke stack. Only nginx, web and web2 are started (--no-deps).
# The stubs are nginx itself (already pulled for the edge) running as its unprivileged user with a config of their
# own: they never switch user, so the services' `cap_drop: ALL` and no-new-privileges stay as in production.
services:
  nginx:
    depends_on: !reset {}
    deploy:
      resources: !reset {}

  web:
    image: docker.io/library/nginx:1.31.6-alpine
    user: '101'
    healthcheck:
      disable: true
    deploy:
      resources: !reset {}
    command:
      - sh
      - -c
      - printf 'pid /tmp/nginx.pid; events {} http { access_log off; client_body_temp_path /tmp/b; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s; server { listen 3000; location / { return 200 "classic $$uri"; } } }' >/tmp/stub.conf && exec nginx -c /tmp/stub.conf -g 'daemon off;'

  web2:
    image: docker.io/library/nginx:1.31.6-alpine
    user: '101'
    healthcheck:
      disable: true
    deploy:
      resources: !reset {}
    command:
      - sh
      - -c
      - printf 'pid /tmp/nginx.pid; events {} http { access_log off; client_body_temp_path /tmp/b; proxy_temp_path /tmp/p; fastcgi_temp_path /tmp/f; uwsgi_temp_path /tmp/u; scgi_temp_path /tmp/s; server { listen 3000; location / { return 200 "new $$uri"; } } }' >/tmp/stub.conf && exec nginx -c /tmp/stub.conf -g 'daemon off;'
