# Every public route. Shared by the :80 (behind the TLS proxy) and :443 servers.

# Callback still registered in the Google console; drop once it is changed to
# /api/v2/auth/google/callback.
location = /api/v1/auth/google/callback {
  limit_req zone=auth_limit burst=20 nodelay;
  proxy_pass http://api_backend/api/v2/auth/google/callback;
}

location /api/v2/auth {
  limit_req zone=auth_limit burst=20 nodelay;
  proxy_pass http://api_backend;
}

# SSE streams: no buffering, long timeouts.
location /api/v2 {
  limit_req zone=api_limit burst=60 nodelay;
  proxy_pass http://api_backend;
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}

# /content/<key>: anonymous read of the ab-public bucket (public-read policy).
# The query is dropped: no anonymous `response-*` overrides.
# Cached in 1 MB slices: a seek into an uncached lecture video fetches only the slices it
# needs, not the whole file from byte 0 (the cache key carries the slice range).
location /content/ {
  rewrite ^/content/(.*)$ /ab-public/$1? break;
  proxy_pass http://rustfs_backend;
  slice 1m;
  proxy_set_header Range $slice_range;
  proxy_cache content_cache;
  proxy_cache_key $uri$slice_range;
  proxy_cache_valid 200 206 7d;
  proxy_cache_lock on;
  proxy_cache_use_stale updating;
  # RustFS answers `Cache-Control: max-age=0`, which nginx honoured: nothing was ever
  # cached, and browsers got two conflicting Cache-Control headers. Keys are immutable.
  proxy_ignore_headers Set-Cookie Cache-Control Expires;
  proxy_hide_header Cache-Control;
  proxy_hide_header x-amz-request-id;
  proxy_hide_header x-amz-id-2;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy $user_content_csp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Cache-Control "public, max-age=604800, immutable";
  access_log off;
}

# Presigned S3 URLs: SigV4 signs host and path, so pass them through verbatim.
# The bucket root too: the server's own S3 calls (DeleteObjects = POST /<bucket>?delete).
location ~ ^/(ab-public|ab-private)(/|$) {
  if ($unsigned_query) {
    return 403;
  }
  client_max_body_size 2G;
  proxy_request_buffering off;
  proxy_pass http://rustfs_backend;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy $user_content_csp always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  access_log off;
}

# Web app. Cached only when the upstream marks the response immutable.
location / {
  proxy_pass http://web_backend;
  # The university proxy in front reads response headers into a 4k buffer. The web
  # app's Link header (hreflang + preloads, 3 KB+ on the home page) overflows it
  # and the proxy answers 502. The same hints are in the HTML.
  proxy_hide_header Link;
  proxy_cache app_cache;
  proxy_no_cache $skip_cache;
}
