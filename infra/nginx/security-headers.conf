# Baseline headers. add_header is not inherited by a block that sets its own,
# so include this in every server and in every location with an add_header.
# CSP belongs to the web app (it needs a per-request nonce).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
