# One workflow for gates, images, stack smoke and publish. A release publishes
# BOTH stage-1 images under the same <sha> tag; main no longer rebuilds the
# frozen old web, so it publishes nothing until stage 2 cutover (Ф8). Pull
# requests run the gates only. Images are pushed as ci-<sha> and retagged to <sha>/latest
# only after the full stack passed smoke; deploy.sh accepts <sha> tags only.
name: ci

on:
  push:
    # ci/**: image build + stack smoke for a branch, never published.
    # release/**: every gate runs regardless of paths, then publishes (a release
    # cut from a commit other than main's head, e.g. while main is red).
    branches: [main, 'ci/**', 'release/**']
  pull_request:

# PRs: a newer push cancels the running one. main: never cancelled while
# running (a queued main run may be superseded by a newer commit).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/meirbek-dev

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      web: ${{ steps.filter.outputs.web == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      web2: ${{ steps.filter.outputs.web2 == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      infra: ${{ steps.filter.outputs.infra == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
            # Frozen old web (G-13): only its image, and only when it changed (Legacy-Hotfix)
            # or on release branches. Its catalogs are Paraglide since 34d8cd2, so it no longer
            # builds on main (QUESTIONS.md Q-2026-10-03-1).
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'bun.lock'
            web2:
              - 'apps/web-2/**'
              - 'apps/server/openapi.v2.json'
              - '.node-version'
            infra:
              - 'compose*.yaml'
              - 'infra/**'
              - '.github/**'
              - 'justfile'
      # Same 8-char prefix deploy.sh uses on the host.
      - id: sha
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  server-gates:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/server
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: 'false'
      # Must match infra/env/dev.env (services come from `just dev-up`).
      DATABASE_URL: postgres://ashyq:ashyq@localhost:5433/ashyq_test
      TEST_REDIS_URL: redis://:ashyq-dev@localhost:6380
      TEST_S3_ENDPOINT: http://localhost:9002
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete,sqlx-cli,just

      - name: Format
        run: just fmt-check

      - name: Dev services (db, redis, zitadel, rustfs)
        working-directory: .
        run: just dev-up

      - name: Migrate test database
        run: just migrate

      - name: Clippy (deny warnings)
        run: just clippy

      - name: SQLx offline cache check
        run: just sqlx-check

      - name: Tests (nextest)
        run: just test

      - name: cargo-deny
        run: just deny

      - name: cargo-machete
        run: just machete

      - name: Coverage floor
        run: just cov

      - name: OpenAPI export is committed and current
        run: just openapi-check

  infra-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the pushed commit range

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: just ci-infra
        run: just ci-infra

      - name: shellcheck
        run: shellcheck -x -S warning infra/scripts/*.sh infra/storage/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2 (docs/MODERNIZATION-STAGE-2.md, section 9): `vp run verify` = check + tests + gates.ts, then the
  # production build with chunk budgets. The freeze gate (G-13) needs the pushed range and origin/main.
  web2-gates:
    needs: changes
    if: needs.changes.outputs.web2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web-2/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Playwright chromium (vitest browser project)
        run: bunx playwright install --with-deps chromium

      - name: Codegen (paraglide; client and route tree must already be committed)
        run: bun run codegen

      - name: Verify (check, tests, gates)
        env:
          GATES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run verify

      - name: Build with chunk budgets
        run: bun run build

  images:
    needs: [changes, server-gates, web2-gates, infra-gates]
    # Gates may be skipped (path filter) but never failed.
    if: >-
      github.event_name == 'push' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # web (frozen) and web-2 (no build args) only when they changed or on release branches.
        image: >-
          ${{ fromJSON(format('["server"{0}{1}]',
          needs.changes.outputs.web == 'true' && ',"web"' || '',
          needs.changes.outputs.web2 == 'true' && ',"web-2"' || '')) }}
    steps:
      - uses: actions/checkout@v7

      # stage-2: the only Next-specific spot; the old web image is bound to the
      # prod domain. (Not a matrix `include`: that would add `web` to every run.)
      - name: Web build args from PROD_DOMAIN
        id: args
        if: matrix.image == 'web'
        env:
          D: ${{ vars.PROD_DOMAIN }}
        run: |
          test -n "$D" || { echo "::error::repository variable PROD_DOMAIN is not set"; exit 1; }
          {
            echo 'list<<EOF'
            echo "NEXT_PUBLIC_SITE_URL=https://$D/"
            echo "NEXT_PUBLIC_API_URL=https://$D/api/v2/"
            echo "NEXT_PUBLIC_MEDIA_URL=https://$D/"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      # The release compile ran out of disk on stock runners (runs #45/#46).
      - name: Free runner disk for the release build
        if: matrix.image == 'server'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/ashyq-${{ matrix.image }}:ci-${{ needs.changes.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}-image
          cache-to: type=gha,scope=${{ matrix.image }}-image,mode=max

  # success() is false when ANY ancestor was skipped (a path-filtered gate),
  # so the jobs after `images` test their direct dependency explicitly.
  stack-smoke:
    needs: [changes, images]
    if: ${{ !failure() && !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ci-${{ needs.changes.outputs.sha }}
      SMOKE_RESOLVE_IP: 127.0.0.1
      # No old web image built (main, apps/web unchanged): the stub web from the start.
      WEB_IMAGE: ${{ needs.changes.outputs.web != 'true' && 'ashyq-stub-web:ci' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stub web image
        run: docker build -t ashyq-stub-web:ci infra/smoke/stub-web

      - name: Stack up (from scratch, bootstrap included)
        run: just stack-up

      - name: Smoke
        run: just smoke

      # R-09: the edge must not depend on Next.js. Swap web for a stub and
      # smoke again; only web and nginx are recreated.
      - name: Smoke with stub web
        if: env.WEB_IMAGE == ''
        env:
          WEB_IMAGE: ashyq-stub-web:ci
        run: |
          bash -c 'source infra/scripts/lib.sh && use_smoke && compose up -d --no-deps --no-build --pull never --force-recreate --wait web nginx'
          just smoke

      - name: Compose logs
        if: failure()
        run: bash -c 'source infra/scripts/lib.sh && use_smoke && compose ps -a && compose logs --no-color --timestamps --tail 500'

  # G-06 (spec section 9): Playwright against ashyq-web-2:ci-<sha> on the seeded stand
  # (`just web2-*`, docs/INFRA.md "Stage 2 e2e stand"). Secret E2E_PASSWORD is optional:
  # without it the stand seeds a random password per run.
  web2-e2e:
    needs: [changes, images]
    if: ${{ !failure() && !cancelled() && needs.images.result == 'success' && needs.changes.outputs.web2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ci-${{ needs.changes.outputs.sha }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web-2/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The stand's origin is https://ashyq.test (presigned URLs must be same-origin).
      - name: Resolve the stand host
        run: echo '127.0.0.1 ashyq.test' | sudo tee -a /etc/hosts

      - name: Playwright dependencies
        working-directory: apps/web-2
        run: |
          bun install --frozen-lockfile
          bun run codegen
          bunx playwright install --with-deps

      - name: Stand up (from scratch, bootstrap included)
        run: just web2-stand-up

      # Also the learner pool (E2E_LEARNERS, default 250): the stand caps self-registration at 10/h.
      - name: Seed
        run: just web2-seed

      # No Judge0 on the stand (privileged); AI specs answer from page.route fixtures.
      - name: e2e
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: just web2-e2e --grep-invert @judge0 --reporter=line,html

      - name: Compose logs
        if: failure()
        run: bash -c 'source infra/scripts/lib.sh && use_web2 && compose ps -a && compose logs --no-color --timestamps --tail 500'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web2-e2e-${{ needs.changes.outputs.sha }}
          path: |
            apps/web-2/playwright-report/
            apps/web-2/test-results/
            tmp/web2/server.log
          retention-days: 7

      - name: Stand down
        if: always()
        run: just web2-stand-down

  publish:
    needs: [changes, stack-smoke]
    # Both images under one <sha>: only when the old web image was built (release branches).
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && !failure() && !cancelled() && needs.stack-smoke.result == 'success' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag ci-<sha> as <sha> and latest (no rebuild)
        env:
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          for img in server web; do
            ref="$IMAGE_REPO/ashyq-$img"
            docker buildx imagetools create -t "$ref:$SHA" -t "$ref:latest" "$ref:ci-$SHA"
          done
