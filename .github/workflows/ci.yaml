# One workflow for gates, images, stack smoke and publish. Only release/** branches
# publish: server, the frozen old web (the rollback target until Ф9) and, when web2-e2e
# is green, ashyq-web-2, all under the same <sha> (docs/STAGE-2-CUTOVER.md). main cannot
# build the old web (QUESTIONS.md Q-2026-10-03-1), so it publishes nothing until Ф9.
# Pull requests run the gates only. Images are pushed as ci-<sha> and retagged to <sha>/latest
# only after the full stack passed smoke; deploy.sh accepts <sha> tags only.
name: ci

on:
  push:
    # ci/**: image build + stack smoke for a branch, never published.
    # release/**: every gate runs regardless of paths, then publishes (a release
    # cut from a commit other than main's head, e.g. while main is red).
    branches: [main, 'ci/**', 'release/**']
  pull_request:

# PRs: a newer push cancels the running one. main: never cancelled while
# running (a queued main run may be superseded by a newer commit).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/meirbek-dev

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      # Not forced on release/**: the old web no longer builds from main; publish carries it.
      web: ${{ steps.filter.outputs.web == 'true' }}
      web2: ${{ steps.filter.outputs.web2 == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      infra: ${{ steps.filter.outputs.infra == 'true' || startsWith(github.ref, 'refs/heads/release/') }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'apps/server/**'
            # Frozen old web (G-13): only its image, and only when it changed (Legacy-Hotfix,
            # from a release/stage1 lineage). Its catalogs are Paraglide since 34d8cd2, so it no
            # longer builds on main (QUESTIONS.md Q-2026-10-03-1).
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'bun.lock'
            web2:
              - 'apps/web-2/**'
              - 'apps/server/openapi.v2.json'
              - '.node-version'
              # the e2e stand and this workflow
              - 'compose.web2.yaml'
              - 'justfile'
              - '.github/workflows/ci.yaml'
            infra:
              - 'compose*.yaml'
              - 'infra/**'
              - '.github/**'
              - 'justfile'
      # Same 8-char prefix deploy.sh uses on the host.
      - id: sha
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

  # Two parallel server jobs (CI-OPT): lints without services, tests on the dev stack.
  # `cov` IS the test gate: llvm-cov runs the whole nextest suite (fails on any failed
  # test) and then the line floor, so the suite is built and run once, not twice.
  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    env:
      # The committed .sqlx cache; server-test's sqlx-check proves it matches the schema.
      SQLX_OFFLINE: 'true'
      CARGO_TERM_QUIET: 'true'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,just

      - name: Format
        run: just fmt-check

      - name: Clippy (deny warnings)
        run: just clippy

      - name: cargo-deny
        run: just deny

      - name: cargo-machete
        run: just machete

      - name: OpenAPI export is committed and current
        run: just openapi-check

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/server
    env:
      SQLX_OFFLINE: 'false'
      # Must match infra/env/dev.env (services come from `just dev-up`).
      DATABASE_URL: postgres://ashyq:ashyq@localhost:5433/ashyq_test
      TEST_REDIS_URL: redis://:ashyq-dev@localhost:6380
      TEST_S3_ENDPOINT: http://localhost:9002
      CARGO_TERM_QUIET: 'true'
      # Coverage needs no debuginfo (-C instrument-coverage); faster builds, smaller cache.
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Quiet on success: only failures, each with its output at the end.
      NEXTEST_STATUS_LEVEL: fail
      NEXTEST_FINAL_STATUS_LEVEL: fail
      NEXTEST_FAILURE_OUTPUT: final
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,sqlx-cli,just

      - name: Dev services (db, redis, zitadel, rustfs)
        working-directory: .
        run: just dev-up

      - name: Migrate test database
        run: just migrate

      - name: SQLx offline cache check
        run: just sqlx-check

      - name: Tests (nextest) with coverage floor
        run: just cov

  infra-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the pushed commit range

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: just ci-infra
        run: just ci-infra

      - name: shellcheck
        run: shellcheck -x -S warning infra/scripts/*.sh infra/storage/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2 (docs/MODERNIZATION-STAGE-2.md, section 9): `vp run verify` = check + tests + gates.ts, then the
  # production build with chunk budgets. The freeze gate (G-13) needs the pushed range and origin/main.
  web2-gates:
    needs: changes
    if: needs.changes.outputs.web2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web-2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web-2/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Playwright chromium (vitest browser project)
        run: bunx playwright install --with-deps chromium

      - name: Codegen (paraglide; client and route tree must already be committed)
        run: bun run codegen

      - name: Verify (check, tests, gates)
        env:
          GATES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run verify

      - name: Build with chunk budgets
        run: bun run build

  # Built in parallel with the gates (CI-OPT): a ci-<sha> tag is "built, not verified";
  # publish still requires every gate (and stack-smoke) before any <sha>/latest tag.
  images:
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # web (frozen) only when it changed; web-2 (no build args) when it changed or on release branches.
        image: >-
          ${{ fromJSON(format('["server"{0}{1}]',
          needs.changes.outputs.web == 'true' && ',"web"' || '',
          needs.changes.outputs.web2 == 'true' && ',"web-2"' || '')) }}
    steps:
      - uses: actions/checkout@v7

      # stage-2: the only Next-specific spot; the old web image is bound to the
      # prod domain. (Not a matrix `include`: that would add `web` to every run.)
      - name: Web build args from PROD_DOMAIN
        id: args
        if: matrix.image == 'web'
        env:
          D: ${{ vars.PROD_DOMAIN }}
        run: |
          test -n "$D" || { echo "::error::repository variable PROD_DOMAIN is not set"; exit 1; }
          {
            echo 'list<<EOF'
            echo "NEXT_PUBLIC_SITE_URL=https://$D/"
            echo "NEXT_PUBLIC_API_URL=https://$D/api/v2/"
            echo "NEXT_PUBLIC_MEDIA_URL=https://$D/"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      # The release compile ran out of disk on stock runners (runs #45/#46). Today's runners
      # have ~75 GB free and the rm costs ~3 min, so only when short.
      - name: Free runner disk for the release build
        if: matrix.image == 'server'
        run: |
          df -h /
          (($(df --output=avail -BG / | tail -1 | tr -dc 0-9) >= 30)) ||
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
              /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/ashyq-${{ matrix.image }}:ci-${{ needs.changes.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}-image
          cache-to: type=gha,scope=${{ matrix.image }}-image,mode=max

  # success() is false when ANY ancestor was skipped (a path-filtered gate),
  # so the jobs after `images` test their direct dependency explicitly.
  stack-smoke:
    needs: [changes, images]
    if: ${{ !failure() && !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ci-${{ needs.changes.outputs.sha }}
      SMOKE_RESOLVE_IP: 127.0.0.1
      # No old web image built (main, apps/web unchanged): the stub web from the start.
      WEB_IMAGE: ${{ needs.changes.outputs.web != 'true' && 'ashyq-stub-web:ci' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stub web image
        run: docker build -t ashyq-stub-web:ci infra/smoke/stub-web

      - name: Stack up (from scratch, bootstrap included)
        run: just stack-up

      - name: Smoke
        run: just smoke

      # R-09: the edge must not depend on Next.js. Swap web for a stub and
      # smoke again; only web and nginx are recreated.
      - name: Smoke with stub web
        if: env.WEB_IMAGE == ''
        env:
          WEB_IMAGE: ashyq-stub-web:ci
        run: |
          bash -c 'source infra/scripts/lib.sh && use_smoke && compose up -d --no-deps --no-build --pull never --force-recreate --wait web nginx'
          just smoke

      # stage-2: the web rollback target (frozen old web, what publish tags ashyq-web:<sha>)
      # against this release's server.
      - name: Smoke with the published old web
        if: needs.changes.outputs.web != 'true' && startsWith(github.ref, 'refs/heads/release/')
        env:
          WEB_IMAGE: ${{ env.IMAGE_REPO }}/ashyq-web:latest
        run: |
          bash -c 'source infra/scripts/lib.sh && use_smoke && compose up -d --no-deps --no-build --force-recreate --wait web nginx'
          just smoke

      # Stage 2 cutover switch (docs/STAGE-2-CUTOVER.md): the new web under compose.prod.yaml's
      # own web block (PUBLIC_ORIGIN, INTERNAL_API_URL), selected by WEB_IMAGE_NAME only.
      - name: Smoke with the new web
        if: needs.changes.outputs.web2 == 'true'
        env:
          WEB_IMAGE: ''
          WEB_IMAGE_NAME: ashyq-web-2
          WEB_MEMORY: 512m
        run: |
          bash -c 'source infra/scripts/lib.sh && use_smoke && compose up -d --no-deps --no-build --force-recreate --wait web nginx'
          just smoke

      - name: Compose logs
        if: failure()
        run: bash -c 'source infra/scripts/lib.sh && use_smoke && compose ps -a && compose logs --no-color --timestamps --tail 500'

  # G-06 (spec section 9): Playwright against ashyq-web-2:ci-<sha> on the seeded stand
  # (`just web2-*`, docs/INFRA.md "Stage 2 e2e stand"). Secret E2E_PASSWORD is optional:
  # without it the stand seeds a random password per run. Three shards, each on its own stand.
  web2-e2e:
    needs: [changes, images]
    if: ${{ !failure() && !cancelled() && needs.images.result == 'success' && needs.changes.outputs.web2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ci-${{ needs.changes.outputs.sha }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web-2/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The stand's origin is https://ashyq.test (presigned URLs must be same-origin).
      - name: Resolve the stand host
        run: echo '127.0.0.1 ashyq.test' | sudo tee -a /etc/hosts

      # The stand comes up while Playwright installs (~1 min saved); its log and exit code are
      # collected by "Stand up" below.
      - name: Stand up in the background (from scratch, bootstrap included)
        run: (set +e; just web2-stand-up >"$RUNNER_TEMP/stand.log" 2>&1; echo $? >"$RUNNER_TEMP/stand.rc") </dev/null >/dev/null 2>&1 &

      - name: Playwright dependencies
        working-directory: apps/web-2
        run: |
          bun install --frozen-lockfile
          bun run codegen
          bunx playwright install --with-deps

      - name: Stand up
        run: |
          until [[ -f $RUNNER_TEMP/stand.rc ]]; do sleep 2; done
          cat "$RUNNER_TEMP/stand.log"
          exit "$(<"$RUNNER_TEMP/stand.rc")"

      # Also the learner pool (E2E_LEARNERS, default 250): the stand caps self-registration at 10/h.
      - name: Seed
        run: just web2-seed

      # No Judge0 on the stand (privileged); AI specs answer from page.route fixtures.
      # dot: one character per test; github: each failure as an annotation (`gh run view`).
      # Shards split by test count and the cheap access.spec matrix comes first: weights 4:3:2
      # even out the time (equal counts ran 3.5/4.5/7.2 min, run 37188033446).
      - name: e2e
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PWTEST_SHARD_WEIGHTS: '4:3:2'
        run: just web2-e2e --grep-invert @judge0 --shard=${{ matrix.shard }}/3 --reporter=dot,github,html

      - name: Compose logs
        if: failure()
        run: bash -c 'source infra/scripts/lib.sh && use_web2 && compose ps -a && compose logs --no-color --timestamps --tail 500'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web2-e2e-${{ needs.changes.outputs.sha }}-${{ matrix.shard }}
          path: |
            apps/web-2/playwright-report/
            apps/web-2/test-results/
            tmp/web2/server.log
          retention-days: 7

      - name: Stand down
        if: always()
        run: just web2-stand-down

  publish:
    needs: [changes, server-lint, server-test, web2-gates, infra-gates, stack-smoke, web2-e2e]
    # Release branches only (every gate runs there). A red web2-e2e withholds ashyq-web-2 but
    # not a server release; any red gate withholds everything (images no longer wait for gates).
    if: >-
      startsWith(github.ref, 'refs/heads/release/') && !cancelled() &&
      needs.server-lint.result == 'success' && needs.server-test.result == 'success' &&
      needs.web2-gates.result == 'success' && needs.infra-gates.result == 'success' &&
      needs.stack-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag ci-<sha> as <sha> and latest (no rebuild)
        env:
          SHA: ${{ needs.changes.outputs.sha }}
          WEB_BUILT: ${{ needs.changes.outputs.web }}
          WEB2_E2E: ${{ needs.web2-e2e.result }}
        run: |
          retag() {
            local ref="$IMAGE_REPO/ashyq-$1"
            docker buildx imagetools create -t "$ref:$SHA" -t "$ref:latest" "$ref:ci-$SHA"
          }
          retag server
          # stage-2: deploy.sh needs ashyq-web:<sha> and the web rollback runs it; frozen, so
          # unless a Legacy-Hotfix rebuilt it, <sha> is the newest published old web.
          if [[ $WEB_BUILT == true ]]; then
            retag web
          else
            docker buildx imagetools create -t "$IMAGE_REPO/ashyq-web:$SHA" "$IMAGE_REPO/ashyq-web:latest"
          fi
          if [[ $WEB2_E2E == success ]]; then
            retag web-2
          else
            echo "::warning::ashyq-web-2:$SHA not published (web2-e2e: $WEB2_E2E)"
          fi
