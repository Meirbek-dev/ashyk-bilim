name: server-ci

on:
  push:
    branches: [rewrite, main]
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-ci.yaml'
  pull_request:
    paths:
      - 'apps/server/**'
      - '.github/workflows/server-ci.yaml'

defaults:
  run:
    working-directory: apps/server

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://ashyq:ashyq@localhost:5432/ashyq_test
  TEST_REDIS_URL: redis://localhost:6379
  TEST_S3_ENDPOINT: http://localhost:9000
  SQLX_OFFLINE: 'false'

# A newer push to the same branch supersedes the running job.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Code gates only; the release image builds in its own job below.
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ashyq
          POSTGRES_PASSWORD: ashyq
          POSTGRES_DB: ashyq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashyq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.1
        env:
          RUSTFS_ACCESS_KEY: ashyq-dev
          RUSTFS_SECRET_KEY: ashyq-dev-secret
          RUSTFS_VOLUMES: /data
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-machete,sqlx-cli,just

      - name: Format
        run: just fmt-check

      - name: Migrate test database
        run: sqlx database create && sqlx migrate run --source migrations

      - name: Create storage buckets
        env:
          AWS_ACCESS_KEY_ID: ashyq-dev
          AWS_SECRET_ACCESS_KEY: ashyq-dev-secret
          AWS_REGION: us-east-1
        run: |
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket ab-public
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket ab-private

      - name: Clippy (deny warnings)
        run: just clippy

      - name: SQLx offline cache check
        shell: bash
        run: just sqlx-check

      - name: Tests (nextest)
        run: just test

      - name: Supply chain (deny + machete)
        run: just deny && just machete

      - name: Coverage floor
        run: just cov

      - name: OpenAPI export is committed and current
        run: |
          cargo run -p ashyq-server -- openapi > /tmp/openapi.v2.json
          diff -u openapi.v2.json /tmp/openapi.v2.json

  # The release image: a full `cargo chef cook` + release compile. Runs beside
  # the gates on its own runner (runs #45/#46 died of disk exhaustion and the
  # 50-minute job limit when it trailed them) and keeps the dependency layer
  # in the GitHub Actions cache, so a routine push recompiles only the
  # workspace crates.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk for the release build
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \n            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,scope=server-image,mode=max
