# Production stack. Deploy with `bun run deploy` (extra/deploy.sh); see
# docs/DEPLOYMENT.md. Local dev services live in docker-compose.dev.yml.
#
# Maintenance jobs (not started by `up`):
#   docker compose run --rm server-migrate     # SQLx migrations
#   docker compose run --rm storage-admin …    # bucket policy / CORS

networks:
  app-net: {}
  data-net: {}
  exec-net:
    internal: true

x-server-env: &server-env
  AB__ENVIRONMENT: production
  AB__SERVER__HOST: 0.0.0.0
  AB__SERVER__PORT: 8000
  AB__SERVER__CORS_ORIGINS: '["https://${NGINX_SERVER_NAME:?}"]'
  # Browser-facing redirects and email links are absolute to the web origin.
  AB__SERVER__WEB_URL: https://${NGINX_SERVER_NAME:?}
  # Registration verification emails; unset = codes only in the server log.
  AB__RESEND__API_KEY: ${AB__RESEND__API_KEY:-}
  AB__RESEND__FROM: ${AB__RESEND__FROM:-Ashyq Bilim <noreply@${NGINX_SERVER_NAME:?}>}
  AB__DATABASE__URL: ${AB__DATABASE__URL:?Set the ashyq database URL}
  AB__REDIS__URL: redis://redis:6379/2
  AB__ZITADEL__BASE_URL: http://zitadel:8080
  AB__ZITADEL__PAT: ${AB__ZITADEL__PAT:?Set the provisioner PAT after Zitadel bootstrap}
  AB__STORAGE__ENDPOINT: https://${NGINX_SERVER_NAME:?}
  AB__STORAGE__ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?}
  AB__STORAGE__SECRET_KEY: ${RUSTFS_SECRET_KEY:?}
  AB__STORAGE__PUBLIC_BUCKET: ab-public
  AB__STORAGE__PRIVATE_BUCKET: ab-private
  AB__TELEMETRY__JSON_LOGS: 'true'
  AB__JUDGE0__BASE_URL: http://judge0-server:2358
  # AI providers (DECISIONS "AI models"): unset keys = AI routes answer 503
  # `ai-disabled` / draft artifacts.
  AB__AI__OPENAI_API_KEY: ${AB__AI__OPENAI_API_KEY:-}
  AB__AI__OPENROUTER_API_KEY: ${AB__AI__OPENROUTER_API_KEY:-}
  AB__AI__OPENAI_MODEL: ${AB__AI__OPENAI_MODEL:-gpt-6-luna}
  AB__AI__OPENROUTER_MODEL: ${AB__AI__OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}

services:
  # ---------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.31.6-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?}
    volumes:
      - ./extra/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./extra/nginx.routes.conf:/etc/nginx/snippets/routes.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx/app
    networks:
      - app-net
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
      rustfs:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Frontend — Next.js standalone server
  # ---------------------------------------------------------------------------
  web:
    image: ashyq-web:${IMAGE_TAG:?Set IMAGE_TAG to the release commit}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${NGINX_SERVER_NAME:?}/
        NEXT_PUBLIC_API_URL: https://${NGINX_SERVER_NAME:?}/api/v2/
        NEXT_PUBLIC_MEDIA_URL: https://${NGINX_SERVER_NAME:?}/
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      INTERNAL_API_URL: http://server:8000/api/v2/
    env_file: .env
    # This host cannot reach its public IP through NAT.
    extra_hosts:
      - '${NGINX_SERVER_NAME:?}:host-gateway'
    networks:
      - app-net
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # Backend — Rust API server + background worker
  # ---------------------------------------------------------------------------
  server:
    image: ashyq-server:${IMAGE_TAG:?}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ['serve']
    restart: unless-stopped
    expose:
      - '8000'
    env_file: .env
    environment: *server-env
    # Public S3 URLs keep their signed host while avoiding NAT loopback.
    extra_hosts:
      - '${NGINX_SERVER_NAME:?}:host-gateway'
    networks:
      - app-net
      - data-net
      - exec-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_started
      rustfs:
        condition: service_started
    # Liveness avoids a dependency cycle: storage uses the public nginx origin.
    # Full readiness (/health/ready) is checked by deploy.sh after nginx.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/v2/health']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  worker:
    image: ashyq-server:${IMAGE_TAG:?}
    command: ['worker']
    restart: unless-stopped
    env_file: .env
    environment: *server-env
    extra_hosts:
      - '${NGINX_SERVER_NAME:?}:host-gateway'
    networks:
      - app-net
      - data-net
      - exec-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zitadel:
        condition: service_started
      rustfs:
        condition: service_started
    healthcheck:
      disable: true
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  server-migrate:
    image: ashyq-server:${IMAGE_TAG:?}
    command: ['migrate']
    profiles: [maintenance]
    env_file: .env
    environment: *server-env
    networks:
      - data-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Identity — Zitadel, internal-only (no public route)
  # ---------------------------------------------------------------------------
  zitadel:
    # Pinned by digest: v4.19.2.
    image: ghcr.io/zitadel/zitadel@sha256:956a298405189a8f6cd4ec92e8828b1bd10caa7da8b139c39d251d7053e33784
    restart: unless-stopped
    command: ['start-from-init', '--masterkeyFromEnv', '--tlsMode', 'disabled']
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?ZITADEL_MASTERKEY must be set (32 chars)}
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?ZITADEL_DB_PASSWORD must be set}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-openu}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: zitadel
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: 'false'
      # Imported user credentials are Argon2id; Zitadel rehashes them under
      # the current policy on first successful login.
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2,bcrypt
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ashyq-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: ashyq-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRATION:?Set PAT expiry in RFC3339 format}
    volumes:
      - zitadel_machinekey:/machinekey
    networks:
      - app-net
      - data-net
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Object storage — RustFS (S3)
  # ---------------------------------------------------------------------------
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set}
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_data:/data
    networks:
      - app-net
      - data-net
    labels:
      - docker-volume-backup.stop-during-backup=true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  storage-admin:
    image: docker.io/amazon/aws-cli:2.37.5
    profiles: [maintenance]
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_PAGER: ''
    volumes:
      - ./extra/storage-public-policy.json:/policy.json:ro
      - ./extra/storage-cors.json:/cors.json:ro
    networks: [data-net]

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:
    build:
      context: .
      dockerfile: extra/Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openu}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-openu}']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - docker-volume-backup.stop-during-backup=true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  # ---------------------------------------------------------------------------
  # Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - docker-volume-backup.stop-during-backup=true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '1.0'

  # ---------------------------------------------------------------------------
  # Code execution tier
  # ---------------------------------------------------------------------------
  judge0-server:
    image: judge0/judge0:1.13.1
    command: ['bash', '-c', 'sudo mkdir -p /box && sudo chmod 1777 /box && exec ./scripts/server']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - judge0_box:/box
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    expose:
      - '2358'
    privileged: true
    restart: unless-stopped
    networks:
      - exec-net
      - data-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
    labels:
      - docker-volume-backup.stop-during-backup=true

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ['bash', '-c', 'sudo mkdir -p /box && sudo chmod 1777 /box && exec ./scripts/workers']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - judge0_box:/box
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    restart: unless-stopped
    networks:
      - exec-net
      - data-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
    labels:
      - docker-volume-backup.stop-during-backup=true

  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------
  backup:
    image: offen/docker-volume-backup:v2.49.1
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: '0 2 * * *'
      BACKUP_RETENTION_DAYS: '7'
      BACKUP_COMPRESSION: zst
      BACKUP_FILENAME: 'backup-%Y-%m-%dT%H-%M-%S.{{ .Extension }}'
      BACKUP_PRUNING_PREFIX: backup-
    volumes:
      - postgres_data:/backup/postgres:ro
      - redis_data:/backup/redis:ro
      - rustfs_data:/backup/rustfs:ro
      - zitadel_machinekey:/backup/zitadel_machinekey:ro
      - judge0_box:/backup/judge0_box:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backups:/archive

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  zitadel_machinekey:
  judge0_box:
  nginx_cache:
