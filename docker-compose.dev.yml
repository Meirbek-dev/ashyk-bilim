# Local dev services for apps/server (`just services`). Ports match
# apps/server/.env.example. Production is docker-compose.yml.

services:
  db:
    build:
      context: .
      dockerfile: extra/Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-ashyq_dev}
    ports: ['5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-openu}']
      interval: 5s
      retries: 10

  redis:
    image: redis:8.10-alpine
    ports: ['6379:6379']

  zitadel:
    image: ghcr.io/zitadel/zitadel@sha256:956a298405189a8f6cd4ec92e8828b1bd10caa7da8b139c39d251d7053e33784
    command: ['start-from-init', '--masterkeyFromEnv', '--tlsMode', 'disabled']
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadelpw}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-openu}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8081
      ZITADEL_EXTERNALSECURE: 'false'
      ZITADEL_SYSTEMDEFAULTS_PASSWORDHASHER_VERIFIERS: argon2,bcrypt
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ashyq-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: ashyq-provisioner
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'
    ports: ['127.0.0.1:8081:8080']
    volumes:
      - ./tmp/zitadel-machinekey:/machinekey
    depends_on:
      db:
        condition: service_healthy

  rustfs:
    image: docker.io/rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-ashyq-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-ashyq-dev-secret}
      RUSTFS_VOLUMES: /data
    ports: ['9002:9000']
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  rustfs_data:
