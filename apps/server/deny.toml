[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (proc-macro, compile-time only, no runtime surface).
  # Pulled transitively; drop this ignore when the dependency chain sheds it.
  "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Our own unpublished workspace crates carry no license field.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  # Boost Software License (permissive, OSI-approved) — xxhash-rust via redis.
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version — that's fine, they're ours.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
