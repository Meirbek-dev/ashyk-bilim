[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, no known vulnerability and no maintained release of lopdf without it. It reaches us only
  # through pdf-extract, which reads submitted PDFs for AI pre-grading inside catch_unwind on a blocking
  # thread (domain files/text.rs); drop pdf-extract or move to a fontations-based lopdf to clear it.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via pdf-extract; see the comment above" },
]

[licenses]
version = 2
# Our own unpublished workspace crates carry no license field.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  # Boost Software License (permissive, OSI-approved) — xxhash-rust via redis.
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version — that's fine, they're ours.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
