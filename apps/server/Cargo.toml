[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates
ab-core = { path = "crates/core" }
ab-db = { path = "crates/db" }
ab-clients = { path = "crates/clients" }
ab-domain = { path = "crates/domain" }
ab-api = { path = "crates/api" }
ab-jobs = { path = "crates/jobs" }
ab-testkit = { path = "crates/testkit" }

# Runtime & web
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "compression-full",
  "timeout",
  "limit",
  "request-id",
  "catch-panic",
  "sensitive-headers",
] }

# Data
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "uuid",
  "json",
  "migrate",
  "macros",
] }
uuid = { version = "1.24.1", features = ["v4", "v7", "serde"] }
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
sha2 = "0.11.0"
time = "0.3.55"
base64 = "0.23.1"
object_store = { version = "0.14.1", features = ["aws"] }
jiff = { version = "0.2.35", features = ["serde"] }

# Serde & validation
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
garde = { version = "0.23.0", features = ["derive", "email", "url"] }

# Config, secrets, errors
figment = { version = "0.10.19", features = ["env"] }
secrecy = { version = "0.10.3", features = ["serde"] }
thiserror = "2.0.20"
anyhow = "1.0.104"

# Telemetry
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.33.0"

# OpenAPI
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

# Bin
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
mimalloc = "0.1.52"

# HTTP client
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }

# Misc
futures = "0.3.34"
http = "1.5.0"
async-stream = "0.3.6"

# Dev
insta = { version = "1.48.0", features = ["json", "redactions"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Agent guardrails: failures must flow through ab_core::Error, never panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Pedantic/nursery noise that fights more than it helps:
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
future_not_send = "allow"
option_if_let_else = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
