[profile.default]
test-threads = 4
# SLOW after 60 s; a test still running after 5 periods is hung and is killed (no test needs
# minutes: add a per-test override here before raising this).
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
# Measures pool starvation against a one-second deadline; needs an idle test DB.
filter = 'test(mark_stampede_never_exhausts_the_pool)'
threads-required = "num-test-threads"

# CI (NEXTEST_PROFILE=ci): the default profile plus a JUnit report at
# target/nextest/ci/junit.xml, uploaded when server-test fails.
[profile.ci.junit]
path = "junit.xml"
