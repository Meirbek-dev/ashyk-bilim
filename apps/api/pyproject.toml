[project]
name = "ashyk-bilim-api"
version = "0.1.0"
description = "Ashyk Bilim Backend"
requires-python = ">=3.14.5,<3.15.0"

dependencies = [
  # Framework
  "fastapi>=0.141.1",
  "granian[reload,uvloop]>=2.8.1",

  # Database
  "sqlalchemy>=2.0.52",
  "sqlmodel>=0.0.39",
  "alembic>=1.19.1",
  "psycopg[binary]>=3.3.4",
  "pgvector>=0.5.0",
  "redis>=8.1.0",

  # Validation / Config
  "pydantic[email]>=2.13.4",
  "pydantic-settings>=2.15.0",

  # Auth
  "fastapi-users[sqlalchemy]>=15.0.5",
  "pyjwt>=2.13.0",

  # AI
  "openai>=3.0.0",
  "pydantic-ai-slim[logfire,openai]>=2.28.0",
  "tiktoken>=0.13.0",

  # Async / Jobs
  "taskiq>=0.12.4",
  "taskiq-fastapi>=0.5.0",
  "taskiq-redis>=1.2.3",

  # API
  "fastapi-pagination>=0.15.16",
  "python-multipart>=0.0.32",

  # Infra / Observability
  "logfire[fastapi,sqlalchemy]>=4.40.0",

  # Utilities
  "cachebox>=6.2.5",
  "httpx>=0.28.1",
  "python-ulid>=4.0.1",
  "resend>=2.36.0",
  "selectolax>=0.4.11",
  "typer>=0.27.1",

  # Sandbox / Execution
  "judge0>=0.0.8",
]

[dependency-groups]
dev = [
  # Lint / Format
  "ruff==0.16.2",
  # Type Checking
  "basedpyright>=1.39.9",
  "mypy>=2.3.0",
  "pyrefly>=1.2.0",
  # Testing
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  # Dev Server
  "uvicorn[standard]>=0.52.1",
  # Fixtures
  "faker>=40.36.0",
  "ty>=0.0.70",
]

[tool.ruff]
target-version = "py315"
preview = true
line-length = 120
force-exclude = true

exclude = [
  ".git",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "node_modules",
  "dist",
  "build",
  "alembic",
  "migrations",
  ".turbo",
  ".logfire",
  ".agents",
  ".mypy_cache",
  ".pyrefly_cache",
  "content",
]

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = [
  "commented-out-code", # Do not auto-delete commented code; require human review.
]

ignore = [
  # --- Annotations (flake8-annotations) ---
  "import-outside-top-level", # `import` should be at the top-level of a file

  # --- General & Style ---
  "missing-trailing-comma", # missing-trailing-comma: Missing a trailing comma (often conflicts with formatters)
  "magic-value-comparison", # magic-value-comparison: Use of unnamed numerical constants in comparisons
  "too-many-arguments", # too-many-arguments: Function has too many arguments (typically > 5)
  "implicit-any-lambda",
  # --- Type Checking (flake8-type-checking) ---
  "typing-only-first-party-import", # move-to-type-checking: Move first-party imports into TYPE_CHECKING blocks
  "typing-only-third-party-import", # move-to-type-checking: Move third-party imports into TYPE_CHECKING blocks
  "typing-only-standard-library-import", # move-to-type-checking: Move stdlib imports into TYPE_CHECKING blocks

  # --- Security (flake8-bandit) ---
  "hardcoded-password-string", # hardcoded-password-string: Possible hardcoded password string assignment
  "hardcoded-password-func-arg", # hardcoded-password-func-arg: Possible hardcoded password in function call
  "try-except-pass", # try-except-pass: Exception caught and silenced with `pass`
  "hardcoded-bind-all-interfaces", # hardcoded-bind-all-interfaces: Warns on binding to 0.0.0.0 (required for Docker)

  # --- Exceptions (tryceratops / flake8-errmsg) ---
  "blind-except", # blind-except: Do not catch `Exception` directly; use specific exceptions
  "raise-vanilla-args", # raise-vanilla-args: Avoid long message strings in exception raises
  "raw-string-in-exception", # raw-string-in-exception: Exception must not use a string literal directly
  "try-consider-else", # try-consider-else: Move code to else block (noisy)
  "raise-within-try", # raise-within-try: Disallow raising within try block (noisy)
  "too-many-statements-in-try-clause", # too-many-statements-in-try-clause: try block with too many statements

  # --- Docstrings (pydocstyle) ---
  "D", # docstring-rules: Disables all docstring-related rules
  "undocumented-public-module", # missing-docstring-in-public-module: Missing docstring at the top of a file
  "docstring-missing-returns", # missing-docstring-in-function: Missing docstring in function
  "docstring-extraneous-returns", # missing-docstring-in-method: Missing docstring in method
  "docstring-missing-exception", # missing-docstring-in-class: Missing docstring in class
  "docstring-extraneous-exception", # docstring-extraneous-exception: Docstring rule
  "docstring-missing-yields", # docstring-missing-yields: Docstring rule

  # --- Miscellaneous ---
  "T20", # flake8-print: Disallows `print` statements (prevents debug debris)
  "missing-todo-author", # missing-todo-author: TODO comment is missing an author name
  "missing-todo-link", # missing-todo-link: TODO comment is missing a link to a tracker/issue
  "line-contains-todo", # line-contains-todo: Disallow TODOs

  "import-private-name",
  "ambiguous-unicode-character-string",
  "ambiguous-unicode-character-docstring", # ambiguous-unicode-character-docstring: False positives on Cyrillic docstrings
  "ambiguous-unicode-character-comment", # ambiguous-unicode-character-comment: False positives on Cyrillic comments
  "line-too-long", # line-too-long: Line is too long

  # --- Project Specific Ignores ---
  "missing-copyright-notice", # missing-copyright-notice: Checks for copyright notice at the top of every file
  "implicit-namespace-package", # implicit-namespace-package: Checks for __init__.py in all directories (noisy for apps)
  "unused-function-argument", # unused-function-argument: Unused function arguments (noisy for FastAPI routes/dependencies)
  "unused-async", # unused-async: Functions defined as async but without await (noisy for route consistency)
  "FBT", # flake8-boolean-trap: Disallow boolean positional arguments (false positives on routes/options)
  "compare-to-empty-string", # compare-to-empty-string: Simplification breaks SQLAlchemy expressions like Column == ""
  "global-statement", # global-statement: Discourage use of global statements (required for lazy singletons)
  "too-many-return-statements", # too-many-return-statements: Pylint complexity check
  "too-many-branches", # too-many-branches: Pylint complexity check
  "too-many-locals", # too-many-locals: Pylint complexity check
  "too-many-statements", # too-many-statements: Pylint complexity check
  "too-many-boolean-expressions", # too-many-boolean-expressions: Pylint complexity check
  "too-many-positional-arguments", # too-many-positional-arguments: Pylint complexity check
  "complex-structure", # complex-structure: McCabe complexity check
  "too-many-nested-blocks", # too-many-nested-blocks: Pylint complexity check
  "no-self-use", # no-self-use: Disallow methods that don't use self (standard for repositories/dependencies)
  "error-suffix-on-exception-name", # error-suffix-on-exception-name: Exception name should end in Error (false positive on HTTPExceptions)
  "private-member-access", # private-member-access: Allow accessing private members (e.g. Row._mapping in SQLAlchemy)
  "logging-f-string", # logging-f-string: Logging statements should not use f-strings (noisy with Logfire)
  "non-empty-init-module", # non-empty-init-module: __init__.py should only contain docstrings and re-exports (noisy for modules with helpers)
  "raise-without-from-inside-except", # raise-without-from-inside-except: Checks for raise within except block without 'from'
  "non-lowercase-variable-in-function", # non-lowercase-variable-in-function: Allow uppercase local constants and capitalized class aliases
  "commented-out-code", # commented-out-code: Allow code-like text in comments
  "assert",
  "stdlib-module-shadowing", # module-shadowing: Allow 'types' module name inside packages
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
  "unused-import", # Allow explicit re-export imports.
  "undefined-local-with-import-star",
]

"**/tests/**/*.py" = [
  "unused-function-argument",
  "unused-method-argument",
  "redefined-while-unused",
  "magic-value-comparison",
  "float-equality-comparison",
  "assert",
  "hardcoded-password-string",
  "hardcoded-password-func-arg",
  "private-member-access",
  "pytest-extraneous-scope-function",
  "pytest-fixture-autouse",
]

"**/conftest.py" = [
  "unused-function-argument",
  "unused-method-argument",
  "unused-import",
  "redefined-while-unused",
  "assert",
  "hardcoded-password-string",
  "hardcoded-password-func-arg",
  "pytest-extraneous-scope-function",
  "pytest-fixture-autouse",
]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]

max-args = 8
max-positional-args = 6
max-branches = 12
max-returns = 6
max-statements = 60
max-locals = 20
max-bool-expr = 5
max-nested-blocks = 5

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["asyncio: mark test as async"]

addopts = ["--strict-config", "--strict-markers"]
[tool.logfire]
ignore_no_config = true
[tool.pyrefly]
project-includes = ["src", "tests"]

project-excludes = ["**/.[!/.]*", "**/__pycache__", ".venv", "alembic", "migrations", "content"]

search-path = ["."]

python-version = "3.15"
python-platform = "linux"

preset = "strict"
min-severity = "error"

check-unannotated-defs = true
infer-return-types = "checked"

enabled-ignores = ["type", "pyrefly"]

ignore-missing-imports = ["cachebox.*", "judge0.*", "python_ulid.*", "selectolax.*"]

[tool.pyrefly.errors]
bad-override = "ignore"
bad-assignment = "ignore"
missing-attribute = "ignore"
bad-argument-type = "ignore"

[tool.mypy]
python_version = "3.15"
files = ["src"]
mypy_path = "$MYPY_CONFIG_FILE_DIR"

plugins = ["pydantic.mypy"]

strict = true

# Make suppressions and config drift visible.
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

# Useful CI/editor output.
show_error_codes = true
show_error_code_links = true
pretty = true

# Stronger correctness checks.
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_subclassing_any = true
strict_equality = true
strict_equality_for_none = true
implicit_reexport = false

enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]

exclude = ["^alembic/", "^migrations/", "^content/", "^src/tests/"]

[[tool.mypy.overrides]]
module = ["cachebox.*", "judge0.*", "selectolax.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.basedpyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"

exclude = ["**/__pycache__", "**/alembic", "**/node_modules", "**/tests", "**/venv", ".venv", "**/migrations"]

# Robustness without the "Any" nitpicking
reportAny = false
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnusedCallResult = false
# Private module helpers (e.g. _helpers.py) are intentionally imported cross-module
reportPrivateUsage = false
# FastAPI decorators and exported helper functions appear "unused" in their own file
reportUnusedFunction = false
# SQLModel class-level column attributes are typed as T|None but carry SQLAlchemy operators
# (ilike, asc, desc, distinct, is_, isnot, in_, etc.) — structural false positives from sqlmodel dual-typing
reportOptionalMemberAccess = false
# SQLModel Session.exec() has no overloads for sqlalchemy Select — structural false positives
reportCallIssue = false
# Bare dict/list/tuple/Callable in legacy function signatures (73 occurrences across 35 files)
reportMissingTypeArgument = false
# isinstance(x, dict) when x is already dict[...] — defensive runtime checks, always True
reportUnnecessaryIsInstance = false
# Comparison of non-overlapping types — defensive runtime guards for SQLModel/ORM returned values
reportUnnecessaryComparison = false
# SQLModel column attributes typed as Python primitives — attribute access false positives
reportAttributeAccessIssue = false
# SQLModel column expressions (col == val) type as bool, int|None passed where int expected
# from DB objects with optional primary keys — structural SQLModel/FastAPI DI false positives
reportArgumentType = false
# SQLModel column operators (e.g. col + val) return bool instead of ColumnElement[bool]
reportOperatorIssue = false
# SQLModel optional column operators (None comparisons in where-clauses) — structural FPs
reportOptionalOperand = false

# Strong correctness guarantees
reportImplicitOverride = true
reportPropertyTypeMismatch = true
reportUnreachable = true

# Better large-codebase maintainability
reportDuplicateImport = true
reportIncompatibleMethodOverride = true
